
name: Android APK build

on:
  workflow_dispatch:
  push:
    paths:
      - '**/*.gradle'
      - '**/*.kt'
      - '**/*.xml'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          mkdir -p _android_source
          unzip -q Sajat_Magyar_Tolmacs_prototipus_0_8_1.zip -d _android_source

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: 

      - name: Install Android SDK packages
        run: |uses: android-actions/setup-android@v4
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        working-directory: _android_source/SajatMagyarTolmacs
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Sajat-Magyar-Tolmacs-debug-APK
          path: _android_source/SajatMagyarTolmacs/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
